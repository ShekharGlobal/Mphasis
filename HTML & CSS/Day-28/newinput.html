<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>HTML5 Input Types Examples</title>
  <style>
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <h1>HTML5 Input Types Examples</h1>
  <form>
    <!-- Email input -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="example@domain.com" required>
    </div>

    <!-- URL input -->
    <div class="form-group">
      <label for="url">Website URL:</label>
      <input type="url" id="url" name="url" placeholder="https://example.com" required>
    </div>

    <!-- Telephone input -->
    <div class="form-group">
      <label for="tel">Telephone:</label>
      <input type="tel" id="tel" name="tel" placeholder="123-456-7890">
    </div>

    <!-- Number input -->
    <div class="form-group">
      <label for="number">Number (between 1 and 10):</label>
      <input type="number" id="number" name="number" min="1" max="10" step="1">
    </div>

    <!-- Range input -->
    <div class="form-group">
      <label for="range">Range (0 to 100):</label>
      <input type="range" id="range" name="range" min="0" max="100" step="10">
    </div>

    <!-- Date input -->
    <div class="form-group">
      <label for="date">Date:</label>
      <input type="date" id="date" name="date">
    </div>

    <!-- Time input -->
    <div class="form-group">
      <label for="time">Time:</label>
      <input type="time" id="time" name="time">
    </div>

    <!-- Datetime-local input -->
    <div class="form-group">
      <label for="datetime">Date and Time (local):</label>
      <input type="datetime-local" id="datetime" name="datetime">
    </div>

    <!-- Month input -->
    <div class="form-group">
      <label for="month">Month:</label>
      <input type="month" id="month" name="month">
    </div>

    <!-- Week input -->
    <div class="form-group">
      <label for="week">Week:</label>
      <input type="week" id="week" name="week">
    </div>

    <!-- Color input -->
    <div class="form-group">
      <label for="color">Favorite Color:</label>
      <input type="color" id="color" name="color">
    </div>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
