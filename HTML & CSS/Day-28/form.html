<html>
<head>
    
    <title> Registration Form</title>
    </head>

<body>
  <form action="#" method="#">
    
    <label for="name">Name</label><br>
    <input type="text" id="name" name="name" value="Enter your Name"><br>
    
    <label for="password">Password</label><br>
    <input type="password" id="password" name="password" ><br>
    
    <label for="address">Address</label><br>
      <textarea name="address" id="address" cols="10" rows="4"></textarea><br>
    
    <input type="checkbox" id="english" name="language" value="english">English<br>
    <input type="checkbox" id="Telgue" name="language" value="telgue" checked>Telgue<br>
    <input type="checkbox" id="Tamil" name="language" value="tamil">Tamil<br>
      
      
      <label for=" country">Country</label>
      
      <select name="country" id="country">
      <option value="1">India</option>
      <option value="2">Australia</option>
      <option value="3">SriLanka</option>
      
      
      </select><br>
      
      
      <input type="radio" id="gender" name="gender" value="gender" checked>
      <label for ="gender">Male</label><br>
      <input type="radio" id="gender" name="gender" value="gender1">
      <label for ="gender">Female</label><br>
    
      
      
      <input type="submit" value="Register" name="register" id="register">
      
       <input type="reset" value="clear" >
    </form>  
    
    
     
    
    
    </body>



</html>
